spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

GEMINI_API_KEY=mock-key
SECRET_KEY=YmFzZTY0LWVuY29kZWQtZHVtbXktc2VjcmV0LWtleS1mb3ItdGVzdHM=
SECRET_REFRESH_KEY=YmFzZTY0LWVuY29kZWQtZHVtbXktcmVmcmVzaC1rZXktZm9yLXRlc3Rz

# AWS. The article store is DynamoDB now, so the context needs a region and a table name to
# build its client. Endpoint and credentials are dummies: nothing in this suite calls AWS, and
# supplying them stops the SDK reaching for an instance profile or SSO during a test run.
aws.region=us-east-2
aws.dynamodb.table-name=MyScrapingHandlerTable
aws.dynamodb.endpoint=http://localhost:8000
news_scraper_queue=http://localhost:4566/000000000000/news_scraper_queue
spring.cloud.aws.region.static=us-east-2
spring.cloud.aws.credentials.access-key=test
spring.cloud.aws.credentials.secret-key=test

# Shared secret for POST /admin/refresh/**; blank would disable those endpoints.
scrape.admin-token=test-admin-token
